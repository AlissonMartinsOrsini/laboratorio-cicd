name: Python CI

on: push

jobs:
  reusable:
    uses: ./.github/workflows/reusable.yml
    with:
      projeto: laboratorio-cicd
      ambiente : teste

  mostrar-resultado:
    needs: reusable
    runs-on: ubuntu-latest

    steps:
      - run: echo "${{ needs.reusable.outputs.resultado }}"

  outro-job:
    uses: ./.github/workflows/reusable.yml
    with:
      projeto: teste 2
      ambiente: teste
      
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{matrix.os}}
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install pytest

      - run: python -m pytest

  build: 
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - run: docker build -t laboratorio-cicd .

      - run: docker run --rm laboratorio-cicd
  
  lambda:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
      - run: sam local invoke MinhaLambda -e event.json

  terraform:
    needs: lambda
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4
        - uses: hashicorp/setup-terraform@v4
        - run: terraform init
          working-directory: terraform

  ai:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Analisar alterações
        run: |
          echo "Analisando alterações..."

          arquivos=$(git diff --name-only HEAD^ HEAD)

          echo "Arquivos alterados:"
          echo "$arquivos"

          if echo "$arquivos" | grep -q "^app.py$"; then
            if ! echo "$arquivos" | grep -q "^tests/"; then
              echo "Possível problema: app.py foi alterado, mas nenhum teste foi alterado."
              echo "Sugestão: revise ou crie testes para essa alteração."
            else
              echo "Código e testes foram alterados."
            fi
          else
            echo "Nenhuma alteração detectada em app.py."
          fi
  previsao-falha:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Analisar histórico
        run: |
          echo "Analisando histórico de pipelines..."
          falhas=$(grep -c "falha" historico_pipeline.txt)

          echo "Número de falhas: $falhas"

          if [ "$falhas" -ge 2 ]; then
            echo "Alerta: existe histórico de falhas. Risco de nova falha."
          else
            echo "Histórico com poucas falhas."
          fi