name: Python CI

on: push

jobs:
  test:
    strategy:
      matrix:
        os: [ubunto-latest, windows-latest]

    runs-on: ${{matrix.os}}
    
    steps:
      - uses: actions/chekout@v4
        with:
          python-version: '3.12'

      - run: python -m pip install pytest

      - run: python -m pytest