name: Python CI

on: push

jobs:
  reusable:
    uses: ./.github/workflows/reusable.yml
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{matrix.os}}
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install pytest

      - run: python -m pytest

  build: 
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - run: docker build -t laboratorio-cicd .

      - run: docker run --rm laboratorio-cicd
  
  lambda:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
      - run: sam local invoke MinhaLambda -e event.json

  terraform:
    needs: lambda
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4
        - uses: hashicorp/setup-terraform@v4
        - run: terraform init
          working-directory: terraform